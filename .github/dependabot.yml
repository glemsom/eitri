version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # charm.land modules (bubbles, bubbletea, glamour, lipgloss) are
      # co-released upstream, so their updates land in one PR instead of four.
      charm:
        patterns:
          - "charm.land/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
