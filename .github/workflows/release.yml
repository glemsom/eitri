name: Release

on:
  push:
    tags: 'v*'

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify tag matches VERSION file
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"  # strip leading "v"
          FILE_VERSION=$(cat VERSION)
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "Version verified: v$FILE_VERSION"

      - name: Run tests (test gate before publishing)
        run: make test-race

      - name: Build release tarballs
        run: make release-all

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="[${VERSION}]" '
            index($0, "## " ver) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Warning: no changelog entry found for $VERSION — falling back to link"
            echo "See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." > /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
