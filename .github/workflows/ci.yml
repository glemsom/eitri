name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install sandbox dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: Run tests (compact verdict, including browser E2E)
        run: make test-race

      - name: Upload test log artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-race-output.log
          path: dist/test-race-output.log
          if-no-files-found: ignore

      - name: Build binary (with embedded version)
        run: make build

      - name: Verify --version matches VERSION file
        run: |
          VERSION=$(cat VERSION)
          BINARY_VER=$(./eitri --version)
          if [ "$BINARY_VER" != "$VERSION" ]; then
            echo "Version mismatch: VERSION=$VERSION, binary reports $BINARY_VER"
            exit 1
          fi
          echo "Binary version: $BINARY_VER ✓"
