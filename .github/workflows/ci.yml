name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"

jobs:

  # Mandatory, blocking job that reproduces environment-driven test flakes on
  # the constrained (cache-cleared, CPU-restricted, sequential) configuration
  # before they reach the main gate. Runs in addition to the mandatory
  # `unit-test` job; a failure here fails the push/PR. Promoted from a
  # diagnostic (non-blocking) job once the constrained harness had provably
  # caught environment-driven flakes (issues #1126 → #1219).
  reproduce-flaky:
    name: Reproduce environment-driven flakes
    runs-on: ubuntu-latest
    # Hard gate since issue #1219: the constrained harness has provably caught
    # environment-driven flakes (the #1127 audit's leak/flake symptoms and the
    # #1217/#1218 constrained-harness reproductions), so flake findings now
    # block the merge instead of surfacing as a warning.
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install sandbox dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: Run constrained reproduce harness (cache-cleared, CPU-restricted, sequential)
        # Mirrors `make test-race` but under the constrained environment that
        # flakes surface in: clears the Go test cache, runs each test under
        # GOMAXPROCS 1 and 2, and forces sequential package execution. Log is
        # teed to dist/test-race-flaky-output.log for the artifact below.
        run: scripts/test.sh --race --flaky

      - name: Upload flaky-reproduce log artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # Log is always produced (even on success), so always upload it.
          name: test-race-flaky-output.log
          path: dist/test-race-flaky-output.log
          if-no-files-found: ignore
  # Fast gate: all non-browser packages under the race detector. The browser
  # E2E suite is build-tagged `e2e` (internal/api/browser_*.go) and excluded
  # here, so a slow browser flake no longer blocks every commit (issue #1122).
  unit-test:
    name: Unit tests + race detector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install sandbox dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: Run unit tests with race detector (browser E2E excluded)
        run: make test-race

      - name: Upload test log artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-race-output.log
          path: dist/test-race-output.log
          if-no-files-found: ignore

      - name: Build binary (with embedded version)
        run: make build

      - name: Verify --version matches VERSION file
        run: |
          VERSION=$(cat VERSION)
          BINARY_VER=$(./eitri --version)
          if [ "$BINARY_VER" != "$VERSION" ]; then
            echo "Version mismatch: VERSION=$VERSION, binary reports $BINARY_VER"
            exit 1
          fi
          echo "Binary version: $BINARY_VER ✓"

  # Slow browser E2E suite (chromedp) runs independently, without the race
  # detector (-race adds no value for DOM assertions and slows streams). A
  # failure here is attributable to this job and does not make the fast
  # unit-test job appear failed.
  browser-e2e:
    name: Browser E2E (chromedp)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable

      - name: Run browser E2E tests (shuffled + repeated regression gate)
        # The gate runs the suite shuffled (`-shuffle=on`) and repeated
        # (`-count 2`) so a single-test wall-clock race (lazy-lib deadline
        # expiry, stale CDP node, unrendered response) surfaces on the PR
        # instead of passing once and later breaking `main` (issue #1219).
        run: ./scripts/test.sh --e2e --shuffle --repeat 2

      - name: Upload browser E2E log artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-e2e-output.log
          path: dist/test-e2e-output.log
          if-no-files-found: ignore
